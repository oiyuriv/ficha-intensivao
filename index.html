<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ficha Intensivão</title>
<meta name="description" content="Treino do dia, dieta e medidas da ficha de hipertrofia até 30/04/2027.">
<meta name="theme-color" content="#EDEFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Intensivão">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: coluna única de celular (máx. 560px), cabeçalho fixo no topo e abas fixas embaixo; amarelo de anilha olímpica marca o "agora", azul marca o deload */
:root{
  --bg:#EDEFEA; --surface:#FFFFFF; --sunk:#E2E5DF; --ink:#16181B; --muted:#5A6067; --line:#D2D6CE;
  --accent:#F2C12E; --on-accent:#16181B;
  --good:#1F7A50; --good-soft:#DCEFE4; --on-good:#FFFFFF;
  --warn:#B4400F; --warn-soft:#F8E3D6; --on-warn:#FFFFFF;
  --blue:#2F62C9; --blue-soft:#E1E9FA;
  --shadow:rgba(22,24,27,.10);
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101214; --surface:#191C1F; --sunk:#23272B; --ink:#ECEEEA; --muted:#9CA3AA; --line:#2E3337;
    --accent:#F2C12E; --on-accent:#16181B;
    --good:#52C68F; --good-soft:#163527; --on-good:#0C2419;
    --warn:#F2915F; --warn-soft:#3A2216; --on-warn:#2A1308;
    --blue:#8AABF3; --blue-soft:#1B2643;
    --shadow:rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101214; --surface:#191C1F; --sunk:#23272B; --ink:#ECEEEA; --muted:#9CA3AA; --line:#2E3337;
  --accent:#F2C12E; --on-accent:#16181B;
  --good:#52C68F; --good-soft:#163527; --on-good:#0C2419;
  --warn:#F2915F; --warn-soft:#3A2216; --on-warn:#2A1308;
  --blue:#8AABF3; --blue-soft:#1B2643;
  --shadow:rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabeçalho */
.top{background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px 10px;display:grid;gap:6px}
.brand-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font:600 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.sync.ok::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px}
.sync.warn{color:var(--warn)}
h1{font:800 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
.h-pre{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;font:700 12px/1 var(--f-body);padding:6px 9px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.chip.acc{background:var(--accent);color:var(--on-accent)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}

/* Conteúdo */
main.wrap{display:grid;gap:18px;padding-block:14px calc(170px + env(safe-area-inset-bottom,0px))}
main > section, main > article{min-width:0}
.sec-h{font:800 24px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:0 0 6px;text-wrap:balance}
.sub{margin:0 0 10px;color:var(--muted);font-size:14px}
.note{color:var(--muted);font-size:14px;margin:8px 0 0}
.note.pad{margin:0;padding:12px 16px;border-top:1px solid var(--line)}
.banner{margin:0;border-radius:12px;padding:12px 14px;background:var(--accent);color:var(--on-accent);font-weight:700}
.empty{margin:0;color:var(--muted);font-size:14px;padding:4px 0}

/* Semana em tiras */
.week{display:grid;gap:8px}
.week-head{display:flex;align-items:center;gap:8px;font:600 13px/1 var(--f-mono);color:var(--muted)}
.week-head span{flex:1}
.nav-b{width:36px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.today-b{height:32px;padding:0 12px;border-radius:8px;border:0;background:var(--ink);color:var(--bg);font:700 13px var(--f-body)}
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.pill{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.pill .wd{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pill .dd{font:800 20px/1 var(--f-display)}
.pill .lt{font:600 11px/1 var(--f-mono);color:var(--muted)}
.pill .bar{height:3px;width:62%;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:2px}
.pill .bar i{display:block;height:100%;background:var(--good)}
.pill.today{border:2px solid var(--ink);padding:7px 0 6px}
.pill.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.sel .wd,.pill.sel .lt{color:var(--bg);opacity:.75}

/* Sessão */
.session{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.s-head{padding:16px 16px 14px}
.eyebrow{margin:0;font:600 11px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.s-title{font:800 26px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.01em;margin:8px 0 0;text-wrap:balance;display:flex;gap:10px;align-items:flex-start}
.letter{flex:none;display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 6px;border-radius:7px;background:var(--accent);color:var(--on-accent);font-size:22px;line-height:1}
.s-meta{margin:8px 0 0;font:500 13px/1.3 var(--f-mono);color:var(--muted)}
.rir{margin:12px 0 0;padding:9px 11px;border-radius:9px;background:var(--sunk);font-size:14px;line-height:1.35}
.rir.deload{background:var(--blue-soft);color:var(--blue);font-weight:700}
.zones{margin:8px 0 0;font:500 12px/1.4 var(--f-mono);color:var(--muted)}

.exs{list-style:none;margin:0;padding:0}
.ex{padding:16px;border-top:1px solid var(--line)}
.ex-top{display:flex;gap:12px;align-items:flex-start}
.ex-num{flex:none;font:800 24px/1 var(--f-display);color:var(--muted);min-width:20px;text-align:center}
.ex-main{min-width:0}
.ex h3{font:700 17px/1.25 var(--f-body);margin:0}
.ex-pres{font:600 14px/1.3 var(--f-mono);margin:4px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tag{font-size:12px;font-weight:700;padding:3px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.tag.hl{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tag.blue{background:var(--blue-soft);border-color:var(--blue-soft);color:var(--blue)}
.ex-body{margin-left:32px;min-width:0}
.ex-det{color:var(--muted);font-size:14px;margin:8px 0 0}
.last{font:500 13px/1.45 var(--f-mono);margin:6px 0 0}
.hint{margin:6px 0 0;font-size:14px;font-weight:700;color:var(--good)}
.sets{display:grid;gap:6px;margin-top:10px}
.set{display:grid;grid-template-columns:18px minmax(0,1fr) minmax(0,1fr) 48px;gap:7px;align-items:center}
.set-n{font:600 13px var(--f-mono);color:var(--muted);text-align:center}
.fld{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:0 10px;min-width:0}
.fld input{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:600 18px/1 var(--f-mono);padding:11px 0;outline:none;font-variant-numeric:tabular-nums}
.fld span{font-size:12px;color:var(--muted)}
.fld:focus-within{border-color:var(--ink);box-shadow:0 0 0 2px var(--accent)}
.fld input::placeholder{color:var(--muted);opacity:.55}
.chk{height:44px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:20px;font-weight:700}
.set.ok .chk{background:var(--good);border-color:var(--good);color:var(--on-good)}
.set.ok .fld{background:var(--good-soft);border-color:transparent}
.how{display:inline-block;margin-top:12px;font-size:14px;font-weight:700;color:var(--blue);text-decoration:underline;text-underline-offset:3px}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--sunk);border-radius:10px;margin:0 16px 14px}
.seg button{padding:10px 6px;border:0;border-radius:7px;background:none;font:700 14px var(--f-body);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}

.tog{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;background:none;border:0;border-top:1px solid var(--line)}
.tog-t{display:grid;gap:2px;min-width:0}
.tog-t b{font-weight:700}
.tog-t small{font-size:14px;color:var(--muted)}
.box{flex:none;width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:15px;font-weight:700;color:transparent;margin-top:1px}
.tog[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:var(--on-good)}
.tog[aria-pressed="true"] .tog-t b{text-decoration:line-through;text-decoration-color:var(--muted)}
.comp{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.comp-t{display:grid;gap:2px;min-width:0}
.comp-t small{font:500 13px var(--f-mono);color:var(--muted)}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none;max-width:60%}
.dot{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:none;font:600 13px var(--f-mono);color:var(--muted)}
.dot.on{background:var(--good);border-color:var(--good);color:var(--on-good)}

/* Semana */
.wlist,.blocks,.rules{list-style:none;margin:0;padding:0}
.wlist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.wlist li + li .wrow{border-top:1px solid var(--line)}
.wrow{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:2px 10px;width:100%;text-align:left;padding:12px 14px;background:none;border:0}
.wrow.today{background:var(--sunk)}
.wr-d{grid-row:1 / span 2;font:500 13px/1.3 var(--f-mono);color:var(--muted)}
.wr-d b{display:block;font:800 18px/1 var(--f-display);color:var(--ink);text-transform:uppercase}
.wr-m{font-weight:700;min-width:0}
.wr-n{grid-column:2;font-size:13px;color:var(--muted)}
.wr-p{grid-column:3;grid-row:1 / span 2;align-self:center;font:600 13px var(--f-mono);color:var(--muted)}
.lt2{display:inline-block;min-width:22px;padding:1px 4px;margin-right:4px;border-radius:4px;background:var(--accent);color:var(--on-accent);font:800 14px/1.2 var(--f-display);text-align:center}
.blocks{display:grid;gap:6px}
.blk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.blk.dl{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.blk.cur{border:2px solid var(--ink);padding:9px 11px}
.blk-n{font-weight:700;flex:1}
.blk-d{font:500 13px var(--f-mono)}
.rules{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.rules li{font-size:15px}
.rules b{display:block}

/* Dieta */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.tile.wide{grid-column:1 / -1;display:flex;align-items:baseline;gap:10px;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tile b{display:block;font:800 28px/1 var(--f-display)}
.tile.wide b{font-size:42px}
.tile span{font-size:13px;color:var(--muted)}
.tile.wide span{color:var(--bg);opacity:.75}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel > :first-child{border-top:0}
.eq{padding:12px 16px;border-top:1px solid var(--line)}
.eq b{display:block;font-weight:700}
.eq p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.adj{margin:0;padding:12px 16px;border-top:1px solid var(--line);font-size:15px}

/* Medidas */
.ck-banner{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 16px}
.ck-banner b{font:800 26px/1 var(--f-display);text-transform:uppercase}
.ck-banner span{font-size:14px;opacity:.8}
.wt{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:10px 14px;align-items:center;padding:14px 16px}
.wt-avg{font:500 13px/1.4 var(--f-mono);color:var(--muted)}
.wt-avg b{display:block;font:800 26px/1 var(--f-display);color:var(--ink)}
.spark{width:100%;height:auto;display:block;padding:0 12px 10px}
.spark .band{fill:var(--good-soft)}
.spark .pt{fill:var(--muted)}
.spark .avg{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.spark text{fill:var(--muted);font:500 10px var(--f-mono)}
.diffs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.diff{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.diff span{font-size:13px;color:var(--muted)}
.diff b{display:block;font:800 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.diff b.good{color:var(--good)}
.ck-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.ck-chip{flex:none;padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:600 13px var(--f-mono)}
.ck-chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:2px 12px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.mrow .mn{font-weight:700}
.mrow .mt{grid-column:1;font:500 13px var(--f-mono);color:var(--muted)}
.mrow .fld{grid-column:2;grid-row:1 / span 2}
.st{font-size:12px;font-weight:700;margin-left:6px}
.st.good{color:var(--good)} .st.warn{color:var(--warn)} .st.muted{color:var(--muted)}
details.how-m{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
details.how-m summary{font-weight:700;cursor:pointer}
details.how-m ul{margin:10px 0 0;padding-left:18px;display:grid;gap:6px;font-size:14px}

/* Cronômetro e abas */
.timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6}
.t-card{background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 12px;display:grid;grid-template-columns:minmax(0,1fr);min-width:0;gap:8px;box-shadow:0 10px 28px var(--shadow)}
.timer.done .t-card{background:var(--accent);color:var(--on-accent)}
.t-bar{height:4px;background:var(--muted);border-radius:2px;overflow:hidden;opacity:.9}
.t-bar i{display:block;height:100%;width:0;background:var(--accent)}
.timer.done .t-bar i{background:var(--on-accent)}
.t-row{display:flex;align-items:center;gap:8px;min-width:0}
.t-btn{flex:none}
.t-row .grow{flex:1;min-width:0}
.t-lbl{margin:0;font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-time{margin:2px 0 0;font:800 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.t-btn{padding:10px 12px;border-radius:9px;border:1px solid currentColor;background:none;font:700 14px var(--f-body);opacity:.9}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 9px;color:var(--muted);text-decoration:none;font:700 12px var(--f-body)}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;pointer-events:none}
.toast.good p{background:var(--good);color:var(--on-good)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;padding:14px 16px}
.btn{flex:1 1 140px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--ink);background:var(--surface);font:700 15px var(--f-body)}
.btn.primary{background:var(--ink);color:var(--bg)}
.toast p{margin:0;background:var(--warn);color:var(--on-warn);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:700;box-shadow:0 8px 24px var(--shadow)}
@media (max-width:360px){
  h1{font-size:26px}
  .ex-body{margin-left:0}
  .set{grid-template-columns:16px minmax(0,1fr) minmax(0,1fr) 44px;gap:6px}
  .fld{padding:0 7px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand-row"><span class="brand">Ficha Intensivão</span><span class="sync" id="sync">Carregando…</span></div>
    <span class="h-pre" id="h-pre">Hoje</span>
    <h1 id="h-date">—</h1>
    <div class="chips" id="h-chips"></div>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="timer" id="timer" hidden>
  <div class="wrap">
    <div class="t-card" role="timer" aria-live="polite">
      <div class="t-bar"><i id="t-fill"></i></div>
      <div class="t-row">
        <div class="grow"><p class="t-lbl" id="t-lbl">Descanso</p><p class="t-time" id="t-time">0:00</p></div>
        <button class="t-btn" data-t="add" type="button">+15 s</button>
        <button class="t-btn" data-t="stop" type="button">Pular</button>
      </div>
    </div>
  </div>
</div>

<input type="file" id="imp" accept="application/json,.json" hidden>
<div class="toast" id="toast" hidden><div class="wrap"><p id="toast-p"></p></div></div>

function ctx(k){

}

}

/* ---------- Render ---------- */
const main=document.getElementById('main'), hDate=document.getElementById('h-date'), hPre=document.getElementById('h-pre'), hChips=document.getElementById('h-chips'), syncEl=document.getElementById('sync');
const tabs=[...document.querySelectorAll('.tabs a')];
let needRender=false;
function header(){
  const k=state.sel, c=ctx(k);
  hPre.textContent=k===TODAY?'Hoje':(k<TODAY?'Dia anterior':'Dia seguinte');
  hDate.textContent=longDate(k);
  const ch=[];
  if(c.pre) ch.push('<span class="chip acc">Começa 02/11</span>');
  ch.push(`<span class="chip">Fase ${c.fase} · ${c.fase===1?'recomposição':'ganho limpo'}</span>`);
  ch.push(c.b.deload?'<span class="chip blue">Semana de deload</span>':c.b.final?'<span class="chip">Bloco final</span>':`<span class="chip">${c.b.nome} · semana ${c.wk}/${c.nwk}</span>`);
  const left=dn(END)-dn(TODAY); if(left>=0) ch.push(`<span class="chip">${left} dias até 30/04</span>`);
  hChips.innerHTML=ch.join('');
}
function render(force){
  const a=document.activeElement;
  if(!force&&a&&a.tagName==='INPUT'&&main.contains(a)){needRender=true;return;}
  needRender=false;
  KEYS=Object.keys(state.days).sort();
  header();
  main.innerHTML=state.view==='semana'?vSemana():state.view==='dieta'?vDieta():state.view==='medidas'?vMedidas():vHoje();
  tabs.forEach(t=>t.setAttribute('aria-current',t.dataset.v===state.view?'page':'false'));
}
main.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(needRender&&!(a&&a.tagName==='INPUT'&&main.contains(a)))render();},0));
function route(scroll){
  const h=(location.hash||'#hoje').slice(1);
  state.view=['hoje','semana','dieta','medidas'].includes(h)?h:'hoje';
  render(true);
  if(scroll) window.scrollTo(0,0);
}
window.addEventListener('hashchange',()=>route(true));

/* ---------- Armazenamento ---------- */
const LS='ficha-intensivao-v1';
const store={mode:'loading',coll:null,timers:{},inflight:{},dirty:{},queued:new Set()};
function setSync(txt,cls){syncEl.textContent=txt;syncEl.className='sync'+(cls?' '+cls:'');}
let toastT=null;
function toast(msg,ok){const t=document.getElementById('toast');t.classList.toggle('good',!!ok);document.getElementById('toast-p').textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},5000);}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({days:state.days,medidas:state.medidas}));}catch(e){toast('Não foi possível salvar no celular. Verifique se o navegador não está em modo anônimo.');}}
function loadLocal(){try{const raw=localStorage.getItem(LS);return raw?JSON.parse(raw):{};}catch(e){return {};}}
const isPending=id=>!!(store.timers[id]||store.inflight[id]||store.dirty[id]||store.queued.has(id));
const anyPending=()=>Object.keys(store.timers).length>0||Object.values(store.inflight).some(Boolean)||Object.values(store.dirty).some(Boolean);
const bodyFor=id=>id==='medidas'?{checkins:clone(state.medidas)}:clone(state.days[id.slice(4)]||{});
function save(id){
  if(store.mode==='local'){saveLocal();return;}
  if(store.mode!=='db'){store.queued.add(id);saveLocal();return;}
  clearTimeout(store.timers[id]);
  store.timers[id]=setTimeout(()=>{delete store.timers[id];flush(id);},700);
  setSync('Salvando…');
}
function errMsg(e){
  const c=e&&e.code;
  if(c==='quota_exceeded') return 'Espaço de registros cheio. Apague dias antigos para continuar salvando.';
  if(c==='invalid_argument') return 'Sua conta não tem permissão para salvar nesta página.';
  if(c==='revoked') return 'O acesso a esta página mudou; os registros não estão sendo salvos.';
  return 'Não foi possível salvar agora. Tente de novo em instantes.';
}
async function flush(id){
  if(store.inflight[id]){store.dirty[id]=true;return;}
  store.inflight[id]=true;
  try{await store.coll.doc(id).set(bodyFor(id));}
  catch(e){
    if(e&&e.code==='unavailable'){await sleep(700+Math.random()*900);try{await store.coll.doc(id).set(bodyFor(id));}catch(e2){toast(errMsg(e2));setSync('Não salvou','warn');}}
    else{toast(errMsg(e));setSync('Não salvou','warn');}
  }
  store.inflight[id]=false;
  if(store.dirty[id]){store.dirty[id]=false;flush(id);return;}
  if(!anyPending()&&syncEl.textContent==='Salvando…') setSync('Salvo na sua conta','ok');
}
function goLocal(){
  if(store.mode==='local') return;
  store.mode='local';
  const saved=loadLocal();
  state.days=Object.assign(saved.days||{},state.days);
  state.medidas=Object.assign(saved.medidas||{},state.medidas);
  store.queued.clear();
  saveLocal();
  setSync('Salvo no celular','ok');
  render();
}
/* ---------- Cronômetro ---------- */
const timerEl=document.getElementById('timer'), tTime=document.getElementById('t-time'), tFill=document.getElementById('t-fill'), tLbl=document.getElementById('t-lbl');
const T={end:0,total:0,name:'',iv:null,hide:null,lock:null};
async function lockScreen(){try{if('wakeLock' in navigator&&!T.lock){T.lock=await navigator.wakeLock.request('screen');T.lock.addEventListener&&T.lock.addEventListener('release',()=>{T.lock=null;});}}catch(e){T.lock=null;}}
function releaseLock(){try{T.lock&&T.lock.release();}catch(e){}T.lock=null;}
function tick(){
  const left=Math.max(0,T.end-Date.now()), s=Math.ceil(left/1000);
  tTime.textContent=`${Math.floor(s/60)}:${pad(s%60)}`;
  tFill.style.width=`${Math.min(100,100-left/(T.total*1000)*100)}%`;
  tLbl.textContent=left>0?`Descanso · ${T.name}`:'Descanso acabou: próxima série';
  if(left<=0&&T.iv){clearInterval(T.iv);T.iv=null;timerEl.classList.add('done');try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}T.hide=setTimeout(()=>{if(!T.iv)stopTimer();},8000);}
}
function startTimer(sec,name){clearTimeout(T.hide);T.total=sec;T.end=Date.now()+sec*1000;T.name=name;timerEl.hidden=false;timerEl.classList.remove('done');clearInterval(T.iv);T.iv=setInterval(tick,250);tick();lockScreen();}
function stopTimer(){clearInterval(T.iv);T.iv=null;clearTimeout(T.hide);timerEl.hidden=true;releaseLock();}
timerEl.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;if(b.dataset.t==='stop')return stopTimer();T.end=Math.max(T.end,Date.now())+15000;T.total+=15;clearTimeout(T.hide);timerEl.classList.remove('done');if(!T.iv)T.iv=setInterval(tick,250);tick();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&T.iv)lockScreen();});

/* ---------- Interações ---------- */
function setRow(k,key,i){const day=getDay(k);day.manha=day.manha||{};const arr=day.manha[key]=(day.manha[key]||[]).slice();while(arr.length<=i)arr.push(null);arr[i]=Object.assign({},arr[i]||{});return arr[i];}
main.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const k=t.dataset.k, act=t.dataset.act;
  if(act==='pick'){state.sel=k;render(true);return;}
  if(act==='wk'){state.sel=addDays(state.sel,+t.dataset.d);render(true);return;}
  if(act==='goday'){state.sel=k;location.hash='#hoje';return;}
  if(act==='ck'){state.ck=+t.dataset.i;render(true);return;}
  if(act==='export'){exportBackup();return;}
  if(act==='import'){document.getElementById('imp').click();return;}
  if(act==='ok'){
    const i=+t.dataset.i, s=setRow(k,t.dataset.ex,i), row=t.closest('.set');
    const ki=row.querySelector('[data-f="kg"]'), ri=row.querySelector('[data-f="reps"]');
    if(!s.ok){
      if(s.kg==null){const v=num(ki.value)!=null?num(ki.value):num(ki.placeholder);if(v!=null)s.kg=v;}
      if(s.reps==null){const v=num(ri.value)!=null?num(ri.value):num(ri.placeholder);if(v!=null)s.reps=Math.round(v);}
      s.ok=true; startTimer(+t.dataset.rest,t.dataset.name);
    } else s.ok=false;
    save('dia-'+k); render(true); return;
  }
  const day=getDay(k);
  if(act==='cardio'){day.noite=Object.assign({},day.noite);day.noite.cardio=!day.noite.cardio;}
  else if(act==='dot'){day.noite=Object.assign({},day.noite);day.noite.c=Object.assign({},day.noite.c);const arr=(day.noite.c[t.dataset.id]||[]).slice();const i=+t.dataset.i;while(arr.length<=i)arr.push(false);arr[i]=!arr[i];day.noite.c[t.dataset.id]=arr;}
  else if(act==='meal'){day.ref=Object.assign({},day.ref);day.ref[t.dataset.id]=!day.ref[t.dataset.id];}
  else if(act==='sup'){day.sup=Object.assign({},day.sup);day.sup[t.dataset.id]=!day.sup[t.dataset.id];}
  else if(act==='dom'){day.dom=t.dataset.o;}
  else if(act==='doma'){day.domA=Object.assign({},day.domA);day.domA[t.dataset.id]=!day.domA[t.dataset.id];}
  else return;
  save('dia-'+k); render(true);
});
main.addEventListener('input',e=>{
  const t=e.target, f=t.dataset.f;
  if(f==='kg'||f==='reps'){
    const s=setRow(t.dataset.k,t.dataset.ex,+t.dataset.i), v=num(t.value);
    if(f==='kg'){if(v==null)delete s.kg;else s.kg=v;} else {if(v==null)delete s.reps;else s.reps=Math.round(v);}
    save('dia-'+t.dataset.k);
  } else if(f==='pesodia'){
    const day=getDay(TODAY), v=num(t.value); if(v==null)delete day.peso; else day.peso=v; save('dia-'+TODAY);
  } else if(t.dataset.mk){
    const ck=t.dataset.ck, row=state.medidas[ck]=Object.assign({},state.medidas[ck]), v=num(t.value);
    if(v==null)delete row[t.dataset.mk]; else row[t.dataset.mk]=v; save('medidas');
  }
});
main.addEventListener('change',e=>{if(e.target.dataset.mk||e.target.dataset.f==='pesodia')needRender=true;});

async function exportBackup(){
  const body=JSON.stringify({app:'ficha-intensivao',versao:1,exportado:new Date().toISOString(),days:state.days,medidas:state.medidas},null,1);
  const name=`ficha-intensivao-backup-${TODAY}.json`;
  const file=new File([body],name,{type:'application/json'});
  const done=()=>{try{localStorage.setItem(LS+'-backup',TODAY);}catch(e){}render(true);toast('Backup gerado. Guarde o arquivo num lugar seguro.',true);};
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Backup Ficha Intensivão'});done();return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);done();
}
document.getElementById('imp').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f) return;
  let data=null; try{data=JSON.parse(await f.text());}catch(err){}
  if(!data||data.app!=='ficha-intensivao'||typeof data.days!=='object'){toast('Esse arquivo não é um backup da Ficha Intensivão.');return;}
  const n=Object.keys(data.days||{}).length, quando=data.exportado?dm(data.exportado.slice(0,10)):'?';
  if(!confirm(`Substituir os registros deste celular pelo backup de ${quando} (${n} dias anotados)?`)) return;
  state.days=data.days||{}; state.medidas=data.medidas||{}; saveLocal(); render(true);
  toast('Backup importado.',true);
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible') return;
  const now=todayKey(); if(now===TODAY) return;
  if(state.sel===TODAY) state.sel=now; TODAY=now; state.ck=null; render(true);
});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{});}catch(e){}
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}

route(false);
goLocal();
})();
</script>
</body>
